<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="sq-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4878E8" />
      <stop offset="50%" stop-color="#7864C9" />
      <stop offset="100%" stop-color="#D64B89" />
    </linearGradient>
    <radialGradient id="sq-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#7864C9" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#4878E8" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#090909" stop-opacity="0" />
    </radialGradient>
    <filter id="sq-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Obsidian Background -->
  <rect width="512" height="512" rx="96" fill="#090909" />
  <rect width="512" height="512" fill="url(#sq-glow)" />
  <rect width="510" height="510" x="1" y="1" rx="95" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="2" />

  <!-- Centered T Monolith Icon (scaled to ~290px) -->
  <g transform="translate(111, 106) scale(2.9)">
    <path d="M 16 20 L 46 20 L 42 36 L 16 36 Z" fill="#F8F8F6" />
    <path d="M 50 20 L 84 20 L 78 36 L 46 36 Z" fill="url(#sq-grad)" />
    <path d="M 42 36 L 58 36 L 58 82 L 42 74 Z" fill="url(#sq-grad)" />
    <path d="M 42 36 L 58 20 L 58 36 Z" fill="#FFFFFF" opacity="0.3" />
    <path d="M 42 74 L 58 82 L 42 82 Z" fill="#D64B89" />
    <circle cx="86" cy="18" r="4.5" fill="#D64B89" filter="url(#sq-blur)" />
  </g>
</svg>